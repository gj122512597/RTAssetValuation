# Nginx 配置：SPA 静态托管 + gzip + 缓存策略 + 安全头

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ===== 安全 / 性能 headers =====
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 隐藏 nginx 版本号
    server_tokens off;

    # ===== gzip（Vite 出来的 JS/CSS 体积大） =====
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml;

    # ===== 安全/资源 headers =====
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ===== 静态资源（/assets/*.js *.css 等带 hash 的，可永久缓存） =====
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 字体和图像也可以长缓存
    location ~* \.(?:png|jpg|jpeg|gif|webp|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ===== index.html 严禁缓存（每次部署 hash 都不一样） =====
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ===== SPA fallback =====
    # React Router 用 history.pushState，不发真的 HTTP 请求给后端
    # 所以 /asset/xxx /intel 等路径都得 fallback 到 index.html
    # 但 build 出来的真实文件（/assets/*）优先
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== 健康端点（容器外探活用，nginx 内置） =====
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ===== 安全：阻止访问 nginx 默认页（防信息泄漏） =====
    location = /50x.html {
        internal;
    }
}
